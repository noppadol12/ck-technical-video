<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>แผนผังวงจร · CK Technical</title>
<link rel="icon" href="/icons/favicon-32.png">
<style>
  html, body { margin: 0; height: 100%; background: #EEF1F5; overflow: hidden; color: #101828;
    font-family: "IBM Plex Sans Thai", "Noto Sans Thai", "Leelawadee UI", Tahoma, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  #stage { position: fixed; inset: 0; touch-action: none; cursor: grab; -webkit-user-select: none; user-select: none; }
  #stage.drag { cursor: grabbing; }
  #paper { position: absolute; left: 0; top: 0; background: #fff; box-shadow: 0 2px 6px rgba(16,24,40,.06), 0 12px 32px rgba(16,24,40,.10); }
  #paper svg { display: block; width: 100%; height: 100%; }
  .bar { position: fixed; display: flex; align-items: center; gap: 2px; padding: 4px; background: rgba(255,255,255,.96); border: 1px solid #E4E8EF;
    border-radius: 12px; box-shadow: 0 4px 16px rgba(16,24,40,.10); backdrop-filter: blur(6px); }
  #ctrl { right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); }
  #head { left: max(12px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top)); padding: 8px 14px; max-width: calc(100vw - 24px); display: none; }
  #head b { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar button { width: 40px; height: 40px; border: 0; background: transparent; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center;
    gap: 6px; color: #344054; cursor: pointer; font: inherit; font-size: 13px; font-weight: 500; }
  .bar button:hover { background: #F2F4F7; color: #101828; }
  .bar button.txt { width: auto; padding: 0 10px; }
  .bar .sep { width: 1px; height: 22px; background: #E4E8EF; margin: 0 2px; }
  #zl { min-width: 54px; font-variant-numeric: tabular-nums; }
  .ic { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #msg { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center;
    padding: 24px; color: #475467; font-size: 15px; }
  #msg a { color: #fff; background: #1F5BD8; text-decoration: none; padding: 10px 18px; border-radius: 10px; font-weight: 600; font-size: 14px; }
  .spin { width: 34px; height: 34px; border: 3px solid #D0D5DD; border-top-color: #1F5BD8; border-radius: 50%; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  #hint { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); background: rgba(16,24,40,.82); color: #fff; font-size: 12.5px;
    padding: 7px 12px; border-radius: 999px; pointer-events: none; transition: opacity .4s; white-space: nowrap; }
  @media (max-width: 480px) { .bar button.txt span { display: none; } .bar button.txt { width: 40px; padding: 0; } }
</style>
</head>
<body>
<div id="stage"><div id="paper"></div></div>
<div id="head" class="bar"><b id="title"></b></div>
<div id="ctrl" class="bar" hidden>
  <button id="zOut" aria-label="ซูมออก"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  <button id="zl" class="txt" aria-label="พอดีหน้าจอ">100%</button>
  <button id="zIn" aria-label="ซูมเข้า"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
  <span class="sep"></span>
  <button id="dl" class="txt" aria-label="ดาวน์โหลดรูป"><svg class="ic" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/></svg><span>ดาวน์โหลด</span></button>
</div>
<div id="msg"><div class="spin"></div></div>
<div id="hint" hidden>ใช้ 2 นิ้วเพื่อซูม · แตะ 2 ครั้งเพื่อขยาย</div>

<script src="/wiring/render.js"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const stage = $('stage'), paper = $('paper');
  const id = new URLSearchParams(location.search).get('id');
  const assets = {};
  let doc = null, pg = null, title = '';
  let k = 1, fitK = 1, tx = 0, ty = 0;

  CKW.bind({ doc: () => doc, asset: a => assets[a] || `/api/wiring/assets/${encodeURIComponent(a)}` });

  function show(text, link) {
    $('msg').innerHTML = `<div>${CKW.esc(text)}</div>${link ? `<a href="${link.href}" target="_top">${CKW.esc(link.label)}</a>` : ''}`;
    $('msg').hidden = false;
  }

  // ---------- ซูม / เลื่อน ----------
  function apply() {
    paper.style.width = pg.w * k + 'px';
    paper.style.height = pg.h * k + 'px';
    paper.style.transform = `translate(${tx}px, ${ty}px)`;
    $('zl').textContent = Math.round(k * 100) + '%';
  }
  function fit() {
    const W = innerWidth, H = innerHeight, m = W < 640 ? 10 : 28, bottom = 64;
    fitK = k = Math.max(0.05, Math.min((W - 2 * m) / pg.w, (H - m - bottom) / pg.h));
    tx = (W - pg.w * k) / 2;
    ty = Math.max(m, (H - bottom - pg.h * k) / 2);
    apply();
  }
  function zoomAt(cx, cy, f) {
    const k2 = Math.min(Math.max(k * f, fitK * 0.6), 8);
    tx = cx - (cx - tx) * k2 / k;
    ty = cy - (cy - ty) * k2 / k;
    k = k2;
    apply();
  }
  const center = () => [innerWidth / 2, innerHeight / 2];

  const pts = new Map();
  let pinch = null, lastTap = 0;
  stage.addEventListener('pointerdown', e => {
    stage.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    stage.classList.add('drag');
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k };
    }
    if (pts.size === 1) {
      const now = Date.now();
      if (now - lastTap < 300) { k < fitK * 1.6 ? zoomAt(e.clientX, e.clientY, 2.5) : fit(); lastTap = 0; }
      else lastTap = now;
    }
  });
  stage.addEventListener('pointermove', e => {
    const p = pts.get(e.pointerId);
    if (!p) return;
    if (pts.size === 1) { tx += e.clientX - p.x; ty += e.clientY - p.y; apply(); }
    p.x = e.clientX; p.y = e.clientY;
    if (pts.size === 2 && pinch) {
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, (pinch.k * d / pinch.d) / k);
    }
  });
  const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) stage.classList.remove('drag'); };
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', up);
  stage.addEventListener('wheel', e => {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey || Math.abs(e.deltaY) >= 40 && !e.deltaX) zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0022));
    else { tx -= e.deltaX; ty -= e.deltaY; apply(); }
  }, { passive: false });
  addEventListener('resize', () => pg && fit());
  $('zIn').onclick = () => zoomAt(...center(), 1.3);
  $('zOut').onclick = () => zoomAt(...center(), 1 / 1.3);
  $('zl').onclick = fit;

  // ---------- ดาวน์โหลดเป็นรูป PNG ----------
  const toDataUrl = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
  $('dl').onclick = async () => {
    const btn = $('dl'); btn.disabled = true;
    try {
      for (const a of CKW.assetIds(doc)) {
        if (assets[a]) continue;
        const res = await fetch(`/api/wiring/assets/${encodeURIComponent(a)}`, { credentials: 'same-origin' });
        if (res.ok) assets[a] = await toDataUrl(await res.blob());
      }
      const img = new Image();
      await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(CKW.exportSVG()); });
      const c = document.createElement('canvas'); c.width = pg.w * 2; c.height = pg.h * 2;
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      const blob = await new Promise(r => c.toBlob(r, 'image/png'));
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (title || 'wiring').replace(/[\\/:*?"<>|]/g, '_') + '.png';
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    } catch (_) {
      alert('ดาวน์โหลดไม่สำเร็จ กรุณาลองใหม่');
    } finally { btn.disabled = false; }
  };

  // ---------- โหลดแผนผัง ----------
  (async () => {
    if (!id) return show('ไม่พบแผนผัง');
    let r;
    try { r = await fetch(`/api/diagrams/${encodeURIComponent(id)}`, { credentials: 'same-origin' }); }
    catch (_) { return show('เชื่อมต่อไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ต'); }
    if (r.status === 401) return show('กรุณาเข้าสู่ระบบก่อนดูแผนผัง', { href: `/?v=${encodeURIComponent(id)}`, label: 'เข้าสู่ระบบ' });
    if (!r.ok) return show('ไม่พบแผนผังนี้ หรือถูกปิดการแสดงแล้ว');
    const g = await r.json();
    const dt = g.data || {};
    doc = { page: dt.page || 'A4L', items: dt.items || [], wires: dt.wires || [] };
    pg = CKW.pageOf(doc);
    title = g.title || '';
    document.title = `${title} · CK Technical`;
    if (window.top === window) { $('title').textContent = title; $('head').style.display = 'flex'; }
    paper.innerHTML = CKW.exportSVG();
    $('msg').hidden = true;
    $('ctrl').hidden = false;
    fit();
    if (matchMedia('(pointer: coarse)').matches) { const h = $('hint'); h.hidden = false; setTimeout(() => { h.style.opacity = 0; }, 2600); }
  })();
})();
</script>
</body>
</html>
