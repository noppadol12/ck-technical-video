<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CK Wiring · หลังบ้าน</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f4;--surface:#fff;--sunken:#f4f6f9;--border:#e4e7ec;--border-2:#d0d5dd;--text:#101828;--text-2:#344054;--muted:#667085;
  --accent:#2563eb;--accent-2:#1d4ed8;--accent-soft:#eef4ff;--danger:#d92d20;--danger-soft:#fef3f2;--warn:#b54708;--warn-soft:#fffaeb;--ok:#067647;
  --shadow-sm:0 1px 2px rgba(16,24,40,.06);--shadow:0 4px 12px rgba(16,24,40,.08),0 1px 3px rgba(16,24,40,.06);--shadow-lg:0 20px 48px rgba(16,24,40,.18)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",Tahoma,system-ui,sans-serif;font-size:13px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.ic.sm{width:15px;height:15px}
#app{display:grid;grid-template-columns:236px 1fr 300px;grid-template-rows:56px 1fr 30px;height:100vh}
/* top bar */
#top{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--border);position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin-right:4px;white-space:nowrap}
.brand svg{width:28px;height:28px}
.spacer{flex:1}
.vsep{width:1px;height:22px;background:var(--border);flex:none}
.group{display:flex;align-items:center;gap:2px;padding:3px;background:var(--sunken);border-radius:10px;flex:none}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 11px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--text-2);font:inherit;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s,box-shadow .12s;flex:none}
.btn:hover{background:var(--sunken);color:var(--text)}
.group .btn:hover{background:var(--surface);box-shadow:var(--shadow-sm)}
.btn.icon{width:32px;padding:0}
.btn.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow-sm)}
.btn.outline{border-color:var(--border-2);background:var(--surface);box-shadow:var(--shadow-sm);color:var(--text)}
.btn.outline:hover{background:var(--sunken)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-2);color:#fff}
.btn.danger{color:var(--danger)}.btn.danger:hover{background:var(--danger-soft)}
.btn.warn{background:var(--warn-soft);color:var(--warn);border-color:#fedf89}
.btn.okc{color:var(--ok)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.sm{height:28px;padding:0 9px;font-size:12px}
.btn.sm.icon{width:28px;padding:0}
.btn.block{width:100%}
#docName{width:230px;font:inherit;font-weight:600;font-size:14px;border:1px solid transparent;border-radius:8px;padding:6px 8px;background:transparent;color:var(--text);flex:none}
#docName:hover{background:var(--sunken)}#docName:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
#zoomLbl{min-width:46px;font-variant-numeric:tabular-nums}
.wsample{width:30px;height:10px;display:block}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#101828;color:#fff;font-size:11.5px;font-weight:500;padding:5px 9px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:80;animation:tip .12s .4s both}
@keyframes tip{from{opacity:0}to{opacity:1}}
@media (max-width:1560px){#top .lbl{display:none}#top .btn.lbl-btn{width:32px;padding:0}#docName{width:170px}}
/* palette */
#pal{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.pal-top{padding:12px 12px 6px}
.search{display:flex;align-items:center;gap:7px;height:34px;padding:0 10px;border:1px solid var(--border-2);border-radius:8px;color:var(--muted);background:#fff}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input[type=text]{border:0;outline:0;box-shadow:none;border-radius:0;font:inherit;flex:1;min-width:0;height:100%;min-height:0;padding:0;background:transparent;color:var(--text)}
.search input[type=text]:focus{box-shadow:none;border:0}
.search input::placeholder{color:var(--muted)}
#palList{overflow:auto;padding:0 12px 24px;flex:1}
.pal-h{font-size:11.5px;font-weight:600;color:var(--text-2);letter-spacing:.04em;margin:14px 2px 8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 8px;border:1px solid var(--border);border-radius:10px;background:#fff;cursor:pointer;font:inherit;color:var(--text-2);transition:border-color .12s,box-shadow .12s,transform .12s}
.tile:hover{border-color:#b2ccff;box-shadow:var(--shadow);color:var(--text)}
.tile:active{transform:scale(.98)}
.tile-ic{width:44px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:var(--sunken)}
.tile-ic svg{width:38px;height:26px}
.tile-lb{font-size:12px;font-weight:500;line-height:1.3;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile-x{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:6px;display:none;align-items:center;justify-content:center;color:var(--muted);background:#fff}
.tile:hover .tile-x{display:flex}.tile-x:hover{color:var(--danger);background:var(--danger-soft)}
.empty{font-size:12px;color:var(--muted);padding:10px;border:1px dashed var(--border-2);border-radius:10px;line-height:1.55}
/* stage */
#stage{position:relative;overflow:hidden;background:var(--bg)}
#cv{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
/* props */
#props{background:var(--surface);border-left:1px solid var(--border);overflow:auto;padding:0 0 30px}
.ph{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2}
.ph-ic{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.ph-t{font-weight:600;font-size:14px}.ph-s{font-size:12px;color:var(--muted)}
.sec{padding:12px 16px;border-bottom:1px solid var(--border)}
.sec:last-child{border-bottom:0}
.sec h4{margin:0 0 8px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.field{margin:0 0 10px}.field:last-child{margin-bottom:0}
.field label{display:block;font-size:12px;color:var(--text-2);margin:0 0 4px;font-weight:500}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
input[type=text],input[type=number],textarea,select{width:100%;font:inherit;color:var(--text);border:1px solid var(--border-2);border-radius:8px;padding:6px 9px;background:#fff;min-height:34px;transition:border-color .12s,box-shadow .12s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:62px;line-height:1.5}
input[type=color]{width:34px;height:28px;padding:2px;border:1px solid var(--border-2);border-radius:7px;background:#fff;cursor:pointer}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg{display:flex;gap:2px;padding:3px;background:var(--sunken);border-radius:9px}
.seg button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;border:0;border-radius:7px;background:transparent;font:inherit;font-size:12px;color:var(--text-2);cursor:pointer}
.seg button.on{background:#fff;color:var(--accent);box-shadow:var(--shadow-sm);font-weight:500}
.sws{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--border-2);padding:0;cursor:pointer;flex:none}
.sw.sq{border-radius:6px}
.sw.on{box-shadow:0 0 0 2px var(--accent)}
.term{display:grid;grid-template-columns:1fr 64px 28px 28px 28px;gap:4px;margin:0 0 4px}
.term .btn{height:34px;width:28px;padding:0;color:var(--muted)}.term .btn:hover{color:var(--text)}
.term .btn.danger:hover{color:var(--danger)}
.help{font-size:12.5px;color:var(--text-2);line-height:1.7}
.help b{color:var(--text);font-weight:600}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:12px;color:var(--text-2);align-items:center}
kbd{justify-self:start;font:500 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;padding:3px 6px;border:1px solid var(--border-2);border-bottom-width:2px;border-radius:5px;background:#fff;color:var(--text);white-space:nowrap}
.note{display:flex;gap:8px;padding:10px 12px;border-radius:10px;background:var(--sunken);color:var(--text-2);font-size:12.5px;line-height:1.6}
.note.ok{background:#ecfdf3;color:#05603a}.note.warn{background:var(--warn-soft);color:var(--warn)}
.note .ic{margin-top:2px}
/* status */
#status{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--surface);border-top:1px solid var(--border);font-size:12px;color:var(--text-2)}
#status .grow{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
#saveState{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;max-width:55%}
#saveState span{overflow:hidden;text-overflow:ellipsis}
#saveState.ok{color:var(--ok)}#saveState.err{color:var(--danger);font-weight:600}
#saveState .ic{width:15px;height:15px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
/* menus */
.menu{display:none;position:fixed;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;z-index:90;min-width:250px}
.menu.open{display:block}
.mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;font:inherit;color:var(--text);cursor:pointer}
.mi:hover{background:var(--sunken)}
.mi .ic{color:var(--text-2)}
.mi small{display:block;color:var(--muted);font-size:11.5px}
.pop-h{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin:6px 6px 8px}
#wirePop{padding:10px;min-width:232px}
#wirePop .sws{padding:0 4px 10px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(16,24,40,.42);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100}
#modal.open{display:flex}
#modal .box{background:#fff;border-radius:16px;width:min(760px,94vw);max-height:86vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);overflow:hidden}
#modal.wide .box{width:min(1280px,96vw)}
#modal .head{display:flex;align-items:center;gap:8px;padding:16px 18px;border-bottom:1px solid var(--border)}
#modal .head h2{font-size:16px;font-weight:600;margin:0;flex:1}
#modal .body{overflow:auto;padding:14px 18px 18px}
.docrow{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;border:1px solid transparent}
.docrow:hover{background:var(--sunken)}
.docrow.cur{background:var(--accent-soft);border-color:#d1e0ff}
.doc-ic{width:36px;height:36px;border-radius:9px;background:var(--sunken);color:var(--text-2);display:flex;align-items:center;justify-content:center;flex:none}
.docrow.cur .doc-ic{background:#fff;color:var(--accent)}
.docrow .nm{flex:1;min-width:0}
.docrow .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.docrow .nm small{display:block;color:var(--muted);font-size:12px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunken);color:var(--text-2);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.pub{background:#ecfdf3;color:#067647}.badge.chg{background:var(--warn-soft);color:var(--warn)}
.pubdot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.pubdot.pub{background:#12b76a}.pubdot.chg{background:#f79009}
#saveState.click{cursor:pointer;text-decoration:underline}
.docrow .acts{display:flex;gap:2px;opacity:.75}.docrow:hover .acts{opacity:1}
.cropwrap{display:flex;justify-content:center;background:#0b1220;border-radius:10px;padding:10px}
#cropCv{cursor:crosshair;max-width:100%;display:block}
/* toast */
#toast{position:fixed;left:50%;bottom:44px;transform:translate(-50%,8px);display:flex;align-items:center;gap:8px;background:#101828;color:#fff;padding:10px 14px;border-radius:10px;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;z-index:200;box-shadow:var(--shadow-lg);max-width:80vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#printArea{display:none}
@media print{#app,#modal,#toast,.menu{display:none!important}#printArea{display:block}html,body{background:#fff;height:auto}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <a class="btn icon" href="/admin/" data-tip="กลับหลังบ้าน"><i data-ic="arrowLeft"></i></a>
    <div class="brand"><svg viewBox="0 0 28 28"><rect width="28" height="28" rx="7" fill="#2563eb"/><path d="M6 17h5V11h6v6h5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="17" r="2" fill="#fff"/><circle cx="22" cy="17" r="2" fill="#fff"/></svg>CK Wiring</div>
    <button class="btn lbl-btn" id="btnDocs" data-tip="งานทั้งหมด"><i data-ic="files"></i><span class="lbl">งานทั้งหมด</span></button>
    <span class="vsep"></span>
    <input id="docName" type="text" title="ชื่องาน" spellcheck="false">
    <span class="spacer"></span>
    <div class="group">
      <button class="btn icon" data-tool="select" data-tip="เลือก / ย้าย  (V)"><i data-ic="pointer"></i></button>
      <button class="btn icon" data-tool="wire" data-tip="ลากสาย  (W)"><i data-ic="wire"></i></button>
      <button class="btn icon" data-tool="pan" data-tip="เลื่อนจอ  (กด Space ค้าง)"><i data-ic="hand"></i></button>
    </div>
    <button class="btn outline" id="btnWire" data-tip="สีและรูปแบบสาย"><svg class="wsample" id="wireSample" viewBox="0 0 30 10"></svg><i data-ic="chev" class="sm"></i></button>
    <div class="group">
      <button class="btn icon" id="btnUndo" data-tip="ย้อนกลับ  (Ctrl+Z)"><i data-ic="undo"></i></button>
      <button class="btn icon" id="btnRedo" data-tip="ทำซ้ำ  (Ctrl+Y)"><i data-ic="redo"></i></button>
    </div>
    <div class="group">
      <button class="btn icon" id="btnZoomOut" data-tip="ซูมออก"><i data-ic="minus"></i></button>
      <button class="btn" id="btnZoomFit" data-tip="พอดีหน้า  (F)"><span id="zoomLbl">100%</span></button>
      <button class="btn icon" id="btnZoomIn" data-tip="ซูมเข้า"><i data-ic="plus"></i></button>
    </div>
    <span class="spacer"></span>
    <button class="btn outline lbl-btn" id="btnCapture" data-tip="แคปหน้าจอ แล้ววางลงงาน"><i data-ic="camera"></i><span class="lbl">แคปภาพ</span></button>
    <button class="btn outline lbl-btn" id="btnPaste" data-tip="วางรูปจากคลิปบอร์ด  (Ctrl+V)"><i data-ic="paste"></i><span class="lbl">วางรูป</span></button>
    <button class="btn outline lbl-btn" id="btnCopyImg" data-tip="คัดลอกแผนผังเป็นรูป เพื่อวางใน LINE"><i data-ic="copy"></i><span class="lbl">คัดลอกรูป</span></button>
    <button class="btn outline" id="btnPublish" data-tip="เผยแพร่ให้ลูกค้าในเว็บวิดีโอ"><span class="pubdot" id="pubDot"></span><span id="pubLbl">เผยแพร่</span></button>
    <button class="btn primary" id="btnExport"><i data-ic="download"></i><span class="lbl">ส่งออก</span><i data-ic="chev" class="sm"></i></button>
  </div>
  <div id="pal"><div class="pal-top"><label class="search"><i data-ic="search" class="sm"></i><input id="palSearch" type="text" placeholder="ค้นหาชิ้นส่วน"></label></div><div id="palList"></div></div>
  <div id="stage">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="gMinor" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#f0f2f5" stroke-width="1"/></pattern>
        <pattern id="gMajor" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#gMinor)"/><path d="M50 0H0V50" fill="none" stroke="#e2e6ec" stroke-width="1"/></pattern>
        <filter id="pgShadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#101828" flood-opacity=".10"/></filter>
      </defs>
      <g id="layer"></g>
    </svg>
  </div>
  <div id="props"></div>
  <div id="status">
    <span class="grow" id="hint"></span>
    <span id="saveState"></span>
  </div>
</div>

<div class="menu" id="exportMenu">
  <button class="mi" data-exp="png"><i data-ic="image"></i><div>รูปภาพ PNG<small>ความละเอียดสูง สำหรับส่งลูกค้า</small></div></button>
  <button class="mi" data-exp="pdf"><i data-ic="fileText"></i><div>PDF / พิมพ์<small>เลือก "บันทึกเป็น PDF" ในหน้าพิมพ์</small></div></button>
  <button class="mi" data-exp="svg"><i data-ic="pen"></i><div>SVG<small>ภาพเวกเตอร์ แก้ไขต่อได้</small></div></button>
  <button class="mi" data-exp="json"><i data-ic="braces"></i><div>ไฟล์งาน JSON<small>สำรอง / ย้ายเครื่อง</small></div></button>
</div>
<div class="menu" id="wirePop"></div>

<div id="modal"><div class="box"><div class="head"><h2 id="mTitle"></h2><span id="mTools" class="row"></span><button class="btn icon" id="mClose"><i data-ic="x"></i></button></div><div class="body" id="mBody"></div></div></div>
<div id="toast"></div>
<div id="printArea"></div>
<input type="file" id="fileJson" accept=".json,application/json" multiple style="display:none">
<input type="file" id="fileImg" accept="image/*" style="display:none">
<style id="pageStyle"></style>

<script src="/wiring/render.js"></script>
<script>
'use strict';
/* ================= Icons (Lucide-style, inline) ================= */
const ICONS={
  files:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h5"/>',
  fileText:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h5M16 13H8M16 17H8M10 9H8"/>',
  folder:'<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  folderPlus:'<path d="M12 10v6M9 13h6"/><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/>',

async function API(path,{method='GET',body,raw,type}={}){
  try{
    const res=await fetch(path,{method,credentials:'same-origin',
      headers:raw?{'Content-Type':type}:body!==undefined?{'Content-Type':'application/json'}:{},
      body:raw||(body!==undefined?JSON.stringify(body):undefined)});
    let data={};try{data=await res.json();}catch(_){}
    if(res.status===401)authLost();
    return{ok:res.ok,status:res.status,data};
  }catch(_){return{ok:false,status:0,data:{error:'network'}};}
}
const lsKey=k=>'ckw:'+k;

/* ---------- รูป: id = sha256 ของไฟล์ ---------- */
function dataUrlToBytes(u){const i=u.indexOf(',');const mime=/data:([^;,]+)/.exec(u.slice(0,i))[1];const bin=atob(u.slice(i+1));const a=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)a[j]=bin.charCodeAt(j);return{mime,bytes:a};}
async function sha256(bytes){const h=await crypto.subtle.digest('SHA-256',bytes);return[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');}
const pendingAssets=new Set();
async function addAsset(dataUrl){
  const{bytes}=dataUrlToBytes(dataUrl);const id=await sha256(bytes);
  if(!ASSETS[id]){ASSETS[id]=dataUrl;pendingAssets.add(id);lsSet('asset:'+id,dataUrl);uploadAssets().catch(()=>{});}
  return id;
}
let uploading=null;
function uploadAssets(){
  if(uploading)return uploading;
  uploading=(async()=>{
    for(const id of [...pendingAssets]){
      const{mime,bytes}=dataUrlToBytes(ASSETS[id]);
      const r=await API(API_BASE+'/assets',{method:'POST',raw:bytes,type:mime});
      if(!r.ok)throw new Error('asset '+r.status);
      pendingAssets.delete(id);lsSet('asset:'+id,null);
    }
  })().finally(()=>{uploading=null;});
  return uploading;
}
const readAsURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b);});
// ดึงรูปมาเก็บเป็น data URL ก่อนส่งออก (PNG/PDF/SVG ต้องฝังรูปในไฟล์)
async function inlineAssets(ids){
  for(const id of ids){if(ASSETS[id])continue;try{const res=await fetch(assetSrc(id),{credentials:'same-origin'});if(res.ok)ASSETS[id]=await readAsURL(await res.blob());}catch(_){}}
}

let saveT=null,dirty=false,saving=false,again=false,conflict=false;
function scheduleSave(){if(!doc)return;dirty=true;writeLocal();setSave('กำลังบันทึก…');clearTimeout(saveT);saveT=setTimeout(saveNow,1200);}
async function saveNow(){
  clearTimeout(saveT);if(!doc||!dirty||conflict)return;
  if(saving){again=true;return;}
  saving=true;dirty=false;const d=doc;
  try{
    await uploadAssets();
    const r=await API(API_BASE+'/'+d.id,{method:'PUT',body:{title:(d.name||'').trim()||'ไม่มีชื่อ',data:docData(d),revision:d.revision}});
    if(r.status===409){conflict=true;dirty=true;setSave('งานนี้ถูกแก้จากหน้าต่างอื่น — คลิกเพื่อโหลดฉบับล่าสุด',true,reloadDoc);return;}
    if(r.status===401){dirty=true;setSave('ต้องเข้าสู่ระบบใหม่ — งานเก็บไว้ในเครื่องแล้ว',true);return;}
    if(!r.ok)throw new Error(r.status);
    Object.assign(d,meta(r.data.diagram));
    if(!dirty&&d===doc)lsSet('pending:'+d.id,null);
    setSave('บันทึกขึ้นระบบแล้ว '+new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}));
    updatePublishBtn();
  }catch(e){
    dirty=true;
    setSave(navigator.onLine?'บันทึกไม่สำเร็จ — จะลองใหม่อัตโนมัติ (งานเก็บไว้ในเครื่องแล้ว)':'ออฟไลน์ — งานเก็บไว้ในเครื่อง จะส่งขึ้นเมื่อกลับมาออนไลน์',true);
    clearTimeout(saveT);saveT=setTimeout(saveNow,8000);
  }finally{saving=false;if(again){again=false;saveNow();}}
}
async function flushSave(){clearTimeout(saveT);for(let i=0;i<150&&saving;i++)await new Promise(r=>setTimeout(r,100));if(dirty&&!conflict)await saveNow();}
function setSave(t,err,onClick){const s=$('#saveState'),k=err?'err':/^กำลัง/.test(t)?'busy':'ok';s.className=k+(onClick?' click':'');s.onclick=onClick||null;s.innerHTML=(k==='err'?ic('alert'):k==='busy'?'<span class="dot"></span>':ic('check'))+'<span>'+esc(t)+'</span>';}

/* ================= Geometry (ส่วนของโปรแกรมวาด — ที่เหลืออยู่ใน /wiring/render.js) ================= */
function allPins(withJunc){
  const out=[];
  for(const it of doc.items){
    if(it.type==='dev')for(const t of it.terms)out.push({ref:{id:it.id,pin:t.id},...devTerm(it,t)});
    else if(it.type==='comp')for(const k of Object.keys(compPins(it)))out.push({ref:{id:it.id,pin:k},...pinPos({id:it.id,pin:k})});
    else if(it.type==='junc'&&withJunc)out.push({ref:{id:it.id,pin:'c'},x:it.x,y:it.y,dir:null});
  }
  return out;
}
const sameRef=(a,b)=>!!(a&&b&&a.id!=null&&a.id===b.id&&a.pin===b.pin);
function findPin(p,withJunc,exclude){
  let best=null,bd=9/view.k;
  for(const q of allPins(withJunc)){if(exclude&&sameRef(q.ref,exclude))continue;const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<=bd){bd=d;best=q;}}
  return best;
}
function segNear(p,a,b){const cx=clamp(p.x,Math.min(a.x,b.x),Math.max(a.x,b.x)),cy=clamp(p.y,Math.min(a.y,b.y),Math.max(a.y,b.y));return{d:Math.hypot(p.x-cx,p.y-cy),x:cx,y:cy};}
function nearestWire(p,tol){
  let best=null;
  for(const w of doc.wires){const P=route(w);
    for(let k=0;k<P.length-1;k++){const r=segNear(p,P[k],P[k+1]);
      if(r.d<=tol&&(!best||r.d<best.d)){
        const a=P[k],b=P[k+1];let pt;
        if(a.y===b.y)pt={x:clamp(snap(p.x),Math.min(a.x,b.x),Math.max(a.x,b.x)),y:a.y};
        else pt={x:a.x,y:clamp(snap(p.y),Math.min(a.y,b.y),Math.max(a.y,b.y))};
        best={w,k,pt,d:r.d};
      }}}
  return best;
}
function splitWire(w,k,pt){
  const P=route(w);
  const J={id:uid(),type:'junc',x:pt.x,y:pt.y,color:w.color};
  doc.items.push(J);
  const w2={...clone(w),id:uid(),a:{id:J.id,pin:'c'},pts:P.slice(k+1,P.length-1)};
  w.pts=P.slice(1,k+1);w.b={id:J.id,pin:'c'};
  doc.wires.push(w2);
  return J;
}
function render(){
  if(!doc)return;
  const pg=page(),k=view.k,hs=8/k;
  let s=`<g transform="translate(${view.tx},${view.ty}) scale(${k})">`;
  s+=`<rect width="${pg.w}" height="${pg.h}" fill="#fff" filter="url(#pgShadow)"/><rect width="${pg.w}" height="${pg.h}" fill="url(#gMajor)"/>`;
  s+=drawContent(true);
  // pins visible in wire mode / while drawing
  if(tool==='wire'||draft)for(const q of allPins(true))s+=`<circle cx="${q.x}" cy="${q.y}" r="${3/k}" fill="none" stroke="#2563eb" stroke-width="${1/k}"/>`;
  // selection

window.addEventListener('pointermove',e=>{

  }

function renderPalette(){

/* ================= Images: file, paste, screen capture ================= */
function loadImage(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src;});}
// ย่อรูปให้ไม่เกิน ~450 KB (เพดานอัปโหลดของระบบ) — webp ถ้าเบราว์เซอร์รองรับ ไม่งั้น jpeg
function canvasToData(src,max=1200,sx=0,sy=0,sw,sh){
  sw=sw||src.width;sh=sh||src.height;let m=max;
  for(let t=0;t<6;t++){
    const s=Math.min(1,m/Math.max(sw,sh));
    const c=document.createElement('canvas');c.width=Math.max(1,Math.round(sw*s));c.height=Math.max(1,Math.round(sh*s));
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(src,sx,sy,sw,sh,0,0,c.width,c.height);
    for(const q of[0.9,0.8,0.7]){let d=c.toDataURL('image/webp',q);if(!d.startsWith('data:image/webp'))d=c.toDataURL('image/jpeg',q);if(d.length*0.75<450000)return{data:d,w:c.width,h:c.height};}
    m=Math.round(m*0.75);
  }
  throw new Error('image_too_large');
}
async function fileToData(file,max=1000){const im=await loadImage(await readAsURL(file));return canvasToData(im,max);}
let lastMouse=null;
async function insertImage(r,at,newItem){
  if(!doc)return;
  const o=newItem?null:curObj(),a=await addAsset(r.data);
  if(o&&o.type==='dev'){o.img=a;commit();render();renderProps();toast('ใส่รูปในกล่อง "'+o.title+'" แล้ว  ·  Ctrl+Z เพื่อยกเลิก','image');return;}
  if(o&&o.type==='title'){o.logo=a;commit();render();renderProps();toast('ใส่โลโก้แล้ว  ·  Ctrl+Z เพื่อยกเลิก','image');return;}
  if(o&&o.type==='img'){o.img=a;o.h=Math.max(20,snap(o.w*r.h/r.w));commit();render();renderProps();toast('เปลี่ยนรูปแล้ว','image');return;}
  const sc=Math.min(1,320/Math.max(r.w,r.h));
  placeItem({id:uid(),type:'img',x:0,y:0,w:snap(r.w*sc)||40,h:snap(r.h*sc)||40,img:a},at||lastMouse||viewCenter());
  toast('วางรูปแล้ว  ·  ลากมุมขวาล่างเพื่อปรับขนาด','image');
}
async function addImageItem(file,at){try{insertImage(await fileToData(file),at,true);}catch(err){toast('เปิดรูปไม่ได้','alert');}}
$('#fileImg').addEventListener('change',async e=>{const f=e.target.files[0];if(f)await addImageItem(f,pendingImgAt);});
const isTyping=e=>/INPUT|TEXTAREA|SELECT/.test((e.target&&e.target.tagName)||'');
document.addEventListener('copy',e=>{if(!doc||isTyping(e)||!sel.size)return;copySel();e.clipboardData.setData('text/plain','ck-wiring:clip');e.preventDefault();});
document.addEventListener('paste',async e=>{
  if(!doc||isTyping(e)||modal.classList.contains('open'))return;
  const cd=e.clipboardData;if(!cd)return;
  if(cd.getData('text/plain')==='ck-wiring:clip'&&clip){e.preventDefault();paste();return;}
  const it=[...cd.items].find(i=>i.kind==='file'&&i.type.startsWith('image/'));
  if(it){e.preventDefault();try{insertImage(await fileToData(it.getAsFile(),1200));}catch(err){toast('วางรูปไม่ได้','alert');}return;}
  if(clip){e.preventDefault();paste();}
});
async function pasteFromClipboard(){
  try{
    const items=await navigator.clipboard.read();
    for(const ci of items){const t=ci.types.find(t=>t.startsWith('image/'));if(t){insertImage(await fileToData(await ci.getType(t),1200),viewCenter());return;}}
    toast('ไม่พบรูปในคลิปบอร์ด  ·  แคปด้วย Win+Shift+S หรือกดปุ่ม "แคปภาพ" ก่อน','info');
  }catch(e){toast('อ่านคลิปบอร์ดไม่ได้  ·  ลองกด Ctrl+V บนกระดาษแทน','info');}
}
let cropSrc=null,cropR=null,cropS=1;
async function captureScreen(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia){toast('เบราว์เซอร์นี้แคปหน้าจอไม่ได้  ·  ใช้ Win+Shift+S แล้ว Ctrl+V แทน','info');return;}
  let stream;
  try{stream=await navigator.mediaDevices.getDisplayMedia({video:{displaySurface:'window'},audio:false,selfBrowserSurface:'include'});}catch(e){return;}
  try{
    const v=document.createElement('video');v.srcObject=stream;v.muted=true;v.playsInline=true;await v.play();
    await new Promise(r=>setTimeout(r,400));
    const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);
    stream.getTracks().forEach(t=>t.stop());openCrop(c);
  }catch(e){stream.getTracks().forEach(t=>t.stop());toast('แคปภาพไม่สำเร็จ','alert');}
}
function openCrop(src){
  cropSrc=src;cropR=null;
  $('#mTitle').textContent='ลากกรอบเลือกส่วนที่ต้องการ';
  $('#mTools').innerHTML=`<button class="btn outline" data-crop="all">${ic('image')}<span>ใช้ทั้งภาพ</span></button><button class="btn primary" data-crop="ok" id="cropOk" disabled>${ic('check')}<span>วางส่วนที่เลือก</span></button>`;
  $('#mBody').innerHTML='<div class="cropwrap"><canvas id="cropCv"></canvas></div>';
  modal.classList.add('open','wide');
  const cv=$('#cropCv');cropS=Math.min((Math.min(innerWidth*0.94,1280)-60)/src.width,(innerHeight*0.86-120)/src.height,1);
  cv.width=Math.round(src.width*cropS);cv.height=Math.round(src.height*cropS);
  const g=cv.getContext('2d');let st=null;
  const draw=()=>{g.drawImage(src,0,0,cv.width,cv.height);if(cropR){g.fillStyle='rgba(16,24,40,.55)';g.fillRect(0,0,cv.width,cv.height);
    g.drawImage(src,cropR.x/cropS,cropR.y/cropS,cropR.w/cropS,cropR.h/cropS,cropR.x,cropR.y,cropR.w,cropR.h);g.strokeStyle='#2563eb';g.lineWidth=2;g.strokeRect(cropR.x,cropR.y,cropR.w,cropR.h);}};
  const pt=e=>{const b=cv.getBoundingClientRect(),k=cv.width/b.width;return{x:clamp((e.clientX-b.left)*k,0,cv.width),y:clamp((e.clientY-b.top)*k,0,cv.height)};};
  cv.onpointerdown=e=>{st=pt(e);cropR=null;cv.setPointerCapture(e.pointerId);};
  cv.onpointermove=e=>{if(!st)return;cropR=normRect(st,pt(e));draw();};
  cv.onpointerup=()=>{st=null;if(cropR&&(cropR.w<6||cropR.h<6))cropR=null;draw();$('#cropOk').disabled=!cropR;};
  draw();
}
function finishCrop(all){
  if(!cropSrc)return;const r=all||!cropR?canvasToData(cropSrc,1400):canvasToData(cropSrc,1400,cropR.x/cropS,cropR.y/cropS,cropR.w/cropS,cropR.h/cropS);
  cropSrc=null;closeModal();insertImage(r,viewCenter());
}

const fname=ext=>(doc.name||'wiring').replace(/[\\/:*?"<>|]/g,'_')+'.'+ext;
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);}
async function renderPNG(scale=2){
  await inlineAssets(assetIds(doc));
  const pg=page(),im=await loadImage('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(exportSVG()));
  const c=document.createElement('canvas');c.width=pg.w*scale;c.height=pg.h*scale;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
  return new Promise(res=>c.toBlob(res,'image/png'));
}
async function exportPNG(){try{download(fname('png'),await renderPNG());}catch(e){toast('ส่งออก PNG ไม่สำเร็จ');}}
async function printPDF(){
  await inlineAssets(assetIds(doc));
  const pg=page();$('#pageStyle').textContent=`@page{size:${pg.css};margin:0}#printArea svg{display:block;width:${pg.mm[0]}mm;height:${pg.mm[1]-1}mm}`;
  $('#printArea').innerHTML=exportSVG();setTimeout(()=>window.print(),50);
}
async function exportJSON(){
  await inlineAssets(assetIds(doc));
  const assets={};for(const id of assetIds(doc))if(ASSETS[id])assets[id]=ASSETS[id];
  const d={name:doc.name,page:doc.page,items:clone(doc.items),wires:clone(doc.wires),assets};
  download(fname('json'),new Blob([JSON.stringify({format:'ck-wiring',version:1,doc:d})],{type:'application/json'}));
}
// นำเข้างานจากโปรแกรมรุ่นในเครื่อง (.ckw.json / ไฟล์สำรองทั้งหมด / ไฟล์คลังอุปกรณ์)
async function importOne(d,assets){
  const map={};
  for(const[oldId,url]of Object.entries(assets||{})){if(typeof url==='string'&&url.startsWith('data:image/')){try{map[oldId]=await addAsset(url);}catch(_){}}}
  for(const it of d.items||[])for(const k of['img','logo'])if(it[k])it[k]=map[it[k]]||(/^[0-9a-f]{64}$/.test(it[k])?it[k]:null);
  await uploadAssets();
  const g=await createDoc((d.name||'งานนำเข้า').slice(0,200),{page:d.page||'A4L',items:d.items||[],wires:d.wires||[]});
  if(!g)throw new Error('create');
  return g;
}
async function importLibrary(list){
  let n=0;
  for(const L of list||[]){
    if(!L||!L.item)continue;const item=clone(L.item);
    if(L.imgData){try{item.img=await addAsset(L.imgData);}catch(_){item.img=null;}}
    else if(item.img&&!/^[0-9a-f]{64}$/.test(item.img))item.img=null;
    if(!library.some(x=>x.name===L.name)){library.push({id:uid(),name:L.name||'อุปกรณ์',item});n++;}
  }
  if(n)await saveLibrary();
  return n;
}
async function importJsonFiles(files){
  let docs=0,libs=0,last=null;
  toast('กำลังนำเข้า…','upload');
  for(const f of files){
    try{
      const o=JSON.parse(await f.text());
      if(o.format==='ck-wiring-backup'){for(const d of o.docs||[]){last=await importOne(d,d.assets);docs++;}libs+=await importLibrary(o.library);}
      else if(o.format==='ck-wiring-library'){libs+=await importLibrary(o.items);}
      else{const d=o.format==='ck-wiring'?o.doc:o;if(!d||!Array.isArray(d.items))throw 0;last=await importOne(d,d.assets);docs++;}
    }catch(e){toast('นำเข้าไม่สำเร็จ: '+f.name,'alert');}
  }
  if(docs||libs)toast(`นำเข้าแล้ว ${docs} งาน${libs?` · อุปกรณ์ ${libs} รายการ`:''}`,'upload');
  if(docs===1&&last){closeModal();await openDocId(last.id);}else if(docs)showDocs();
}

    <div class="field"><label>หมวดหมู่</label><select id="pubCat"><option value="">ทั่วไป (ไม่มีหมวด)</option>${cats.map(x=>`<option value="${x.id}"${String(defCat)===String(x.id)?' selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
    <div class="field"><label>ใช้แทนไฟล์ PDF เดิมบน Google Drive (ไม่บังคับ)</label><select id="pubReplace"><option value="">— ไม่แทน PDF ใด —</option>${pdfs.map(x=>`<option value="${x.id}"${doc.replaces_video_id===x.id?' selected':''}>${esc(x.title)}${x.is_published?'':' (ซ่อนอยู่)'}</option>`).join('')}</select>
      <p class="help" style="margin:6px 0 0">PDF ที่เลือกจะถูกซ่อนจากลูกค้า และจะแสดงกลับเองถ้าหยุดเผยแพร่แผนผังนี้</p></div>
    <div class="row" style="margin-top:16px;justify-content:space-between">
      <div class="row">${doc.is_published?`<button class="btn outline" data-pub="link">${ic('link','sm')}<span>คัดลอกลิงก์ลูกค้า</span></button><button class="btn danger" data-pub="stop">${ic('eyeOff','sm')}<span>หยุดเผยแพร่</span></button>`:''}</div>
      <button class="btn primary" data-pub="go">${ic('globe','sm')}<span>${doc.is_published?'อัปเดตให้ลูกค้า':'เผยแพร่'}</span></button>
    </div>`;
}
async function doPublish(kind){
  if(kind==='link'){const url=location.origin+'/?v='+encodeURIComponent(doc.id);try{await navigator.clipboard.writeText(url);toast('คัดลอกลิงก์แล้ว','link');}catch(_){prompt('คัดลอกลิงก์นี้',url);}return;}
  if(kind==='go'){const t=$('#pubTitle').value.trim();if(t&&t!==doc.name){doc.name=t;$('#docName').value=t;commit();await flushSave();}}
  const body=kind==='go'?{publish:true,category_id:$('#pubCat').value?Number($('#pubCat').value):null,replace_video_id:$('#pubReplace').value||null}:{publish:false};
  if(kind==='stop'&&!confirm('หยุดเผยแพร่? ลูกค้าจะไม่เห็นแผนผังนี้'))return;
  const r=await API(API_BASE+'/'+doc.id+'/publish',{method:'POST',body});
  if(!r.ok){toast('ไม่สำเร็จ ('+(r.data.error||r.status)+')','alert');return;}
  Object.assign(doc,meta(r.data.diagram));updatePublishBtn();renderProps();closeModal();
  toast(kind==='go'?'เผยแพร่แล้ว — ลูกค้าเห็นในหมวด '+(doc.category||'ทั่วไป'):'หยุดเผยแพร่แล้ว',kind==='go'?'globe':'eyeOff');
}
const modal=$('#modal');
function closeModal(){modal.classList.remove('open','wide');cropSrc=null;}
$('#mClose').onclick=closeModal;
$('#btnPublish').onclick=showPublish;
modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
$('#btnDocs').onclick=showDocs;
async function showDocs(){
  saveNow();
  $('#mTitle').textContent='งานทั้งหมด';
  $('#mTools').innerHTML=`<button class="btn outline sm" data-dm="import" data-tip="ไฟล์ .ckw.json หรือไฟล์สำรองจากโปรแกรมในเครื่อง">${ic('upload','sm')}<span>นำเข้า</span></button><button class="btn primary sm" data-dm="new">${ic('plus','sm')}<span>งานใหม่</span></button>`;
  $('#mBody').innerHTML='<p class="help">กำลังโหลด…</p>';modal.classList.remove('wide');modal.classList.add('open');
  const r=await API(API_BASE);
  if(!r.ok){$('#mBody').innerHTML=`<div class="note warn">${ic('alert','sm')}<div>${r.status===0?'ออฟไลน์ — โหลดรายการงานไม่ได้':r.data.error==='not_ready'?'ยังไม่ได้ติดตั้งฐานข้อมูลแผนผัง (รัน supabase/phase5.sql)':'โหลดรายการงานไม่สำเร็จ'}</div></div>`;return;}
  const docs=r.data.diagrams||[];
  $('#mTitle').textContent='งานทั้งหมด ('+docs.length+')';
  const badge=d=>d.is_published?(d.has_changes?'<span class="badge chg">มีแก้ไขยังไม่อัปเดต</span>':'<span class="badge pub">เผยแพร่แล้ว</span>'):'<span class="badge">ฉบับร่าง</span>';
  $('#mBody').innerHTML=(docs.map(d=>`<div class="docrow${doc&&d.id===doc.id?' cur':''}"><span class="doc-ic">${ic('fileText')}</span><div class="nm"><b>${esc(d.title)}</b><small>${badge(d)} ${d.category?esc(d.category)+' · ':''}แก้ไขล่าสุด ${new Date(d.updated_at).toLocaleString('th-TH')}</small></div>
    <div class="acts"><button class="btn sm outline" data-dm="open" data-id="${d.id}">เปิด</button><button class="btn sm icon" data-dm="dup" data-id="${d.id}" data-tip="ทำสำเนา">${ic('copy','sm')}</button><button class="btn sm icon danger" data-dm="del" data-id="${d.id}" data-name="${esc(d.title)}" data-tip="ลบ">${ic('trash','sm')}</button></div></div>`).join('')||'<p class="help">ยังไม่มีงาน กด "งานใหม่" หรือ "นำเข้า" งานจากโปรแกรมในเครื่อง</p>');
}
modal.addEventListener('click',async e=>{
  const cb=e.target.closest('[data-crop]');if(cb){finishCrop(cb.dataset.crop==='all');return;}
  const pb=e.target.closest('[data-pub]');if(pb){doPublish(pb.dataset.pub);return;}
  const b=e.target.closest('[data-dm]');if(!b)return;const a=b.dataset.dm,id=b.dataset.id;
  if(a==='new')return newDocument();
  if(a==='import')return $('#fileJson').click();
  if(a==='open'){closeModal();await openDocId(id);return;}
  if(a==='dup'){const r=await API(API_BASE+'/'+id);if(!r.ok)return toast('ทำสำเนาไม่สำเร็จ','alert');const g=r.data.diagram;if(await createDoc((g.title+' (สำเนา)').slice(0,200),g.data)){toast('ทำสำเนาแล้ว','copy');showDocs();}return;}
  if(a==='del'){
    if(!confirm('ลบงาน "'+b.dataset.name+'" ถาวร?\nถ้าเผยแพร่อยู่ ลูกค้าจะไม่เห็นอีก'))return;
    const r=await API(API_BASE+'/'+id,{method:'DELETE'});
    if(!r.ok)return toast(r.data.error==='owner_only'?'เฉพาะเจ้าของระบบที่ลบได้':'ลบไม่สำเร็จ','alert');
    lsSet('pending:'+id,null);
    if(doc&&doc.id===id){doc=null;dirty=false;const l=await API(API_BASE);const next=(l.data.diagrams||[])[0];if(next)await openDocId(next.id);else await newDocument();}
    showDocs();
  }
});

/* ================= Misc ================= */
let toastT=null;
function toast(t,icon='check'){const el=$('#toast');el.innerHTML=ic(icon,'sm')+'<span>'+esc(t)+'</span>';el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2600);}

/* ================= Boot ================= */
(async function boot(){
  renderPalette();renderWireColors();setTool('select');setSave('กำลังโหลด…');
  // รูปที่ยังอัปโหลดไม่เสร็จจากครั้งก่อน
  try{for(const k of Object.keys(localStorage))if(k.startsWith('ckw:asset:')){const id=k.slice(10),u=lsGet('asset:'+id);if(u){ASSETS[id]=u;pendingAssets.add(id);}}}catch(_){}
  const me=await API('/api/admin/me');
  if(!me.ok){if(me.status!==401)setSave('เชื่อมต่อระบบไม่ได้ — ตรวจสอบอินเทอร์เน็ต แล้วโหลดหน้าใหม่',true);return;}
  const s=await API(API_BASE+'/settings');
  if(s.status===503){setSave('ยังไม่ได้ติดตั้งฐานข้อมูลแผนผัง — รัน supabase/phase5.sql ใน Supabase ก่อน',true);showDocs();return;}
  if(s.ok){library=s.data.library||[];titleDefault=s.data.title_default||null;renderPalette();}
  if(pendingAssets.size)uploadAssets().catch(()=>{});
  const l=await API(API_BASE);
  if(!l.ok){setSave('โหลดรายการงานไม่สำเร็จ',true);return;}
  const list=l.data.diagrams||[],want=new URLSearchParams(location.search).get('id')||lsGet('lastDoc');
  const target=list.find(d=>d.id===want)||list[0];
  if(location.search)history.replaceState(null,'',location.pathname);
  if(target)await openDocId(target.id);else await newDocument();
})();
</script>
